networks:
  homenet:
    name: homenet
    driver: bridge

services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.19
    container_name: qdrant
    hostname: qdrant.domain.local
    restart: always
    networks:
      - homenet
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - "./qdrant/data:/qdrant/storage"
